name: Blender 4.4 Camera Projection

# Manual-only while the rewrite branch is under active development.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-camera-projection-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: "4.4.0"
  BLENDER_ARCHIVE: "blender-4.4.0-linux-x64.tar.xz"
  BLENDER_DIRECTORY: ".blender/blender-4.4.0"

jobs:
  blender-camera-projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Blender 4.4
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BLENDER_DIRECTORY }}
          key: blender-${{ runner.os }}-${{ runner.arch }}-${{ env.BLENDER_VERSION }}

      - name: Download official Blender archive
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .blender/download "${BLENDER_DIRECTORY}"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://download.blender.org/release/Blender4.4/${BLENDER_ARCHIVE}" \
            --output ".blender/download/${BLENDER_ARCHIVE}"
          tar \
            --extract \
            --file ".blender/download/${BLENDER_ARCHIVE}" \
            --directory "${BLENDER_DIRECTORY}" \
            --strip-components=1
          test -x "${BLENDER_DIRECTORY}/blender"

      - name: Run camera render projection fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_camera_projection_integration.py \
            2>&1 | tee test-results/blender-camera-projection.log

      - name: Run recursive node group fixtures
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_recursive_node_group_integration.py \
            2>&1 | tee test-results/blender-recursive-node-groups.log

      - name: Run shader capability audit fixtures
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_shader_capability_audit_integration.py \
            2>&1 | tee test-results/blender-shader-capability-audit.log

      - name: Run renderer contract fixtures
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_render_engine_contract_integration.py \
            2>&1 | tee test-results/blender-render-engine-contract.log

      - name: Run production capability gate fixtures
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_production_capability_gate_integration.py \
            2>&1 | tee test-results/blender-production-capability-gate.log

      - name: Run multi-object projection crop fixtures
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_camera_projection_multi_integration.py \
            2>&1 | tee test-results/blender-camera-projection-multi.log

      - name: Upload camera projection logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.4-camera-projection-log
          path: test-results/*.log
          if-no-files-found: warn
          retention-days: 7
