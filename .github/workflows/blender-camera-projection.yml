name: Blender 4.4 Camera Projection

on:
  pull_request:
    branches: ["main", "master"]
    paths:
      - ".github/workflows/blender-camera-projection.yml"
      - "Blender_to_Spine2D_Mesh_Exporter/application/a1_camera_projection.py"
      - "Blender_to_Spine2D_Mesh_Exporter/application/__init__.py"
      - "Blender_to_Spine2D_Mesh_Exporter/blender_adapter/a1_object_preparation.py"
      - "Blender_to_Spine2D_Mesh_Exporter/blender_adapter/a1_projection_finalization.py"
      - "Blender_to_Spine2D_Mesh_Exporter/blender_adapter/a1_single_object_export.py"
      - "Blender_to_Spine2D_Mesh_Exporter/blender_adapter/a1_multi_object_output.py"
      - "Blender_to_Spine2D_Mesh_Exporter/blender_adapter/a1_mixed_object_output.py"
      - "Blender_to_Spine2D_Mesh_Exporter/blender_adapter/bake_executor.py"
      - "Blender_to_Spine2D_Mesh_Exporter/blender_adapter/camera_projection_executor.py"
      - "Blender_to_Spine2D_Mesh_Exporter/blender_adapter/camera_projection_executor_core.py"
      - "Blender_to_Spine2D_Mesh_Exporter/blender_adapter/camera_projection_image.py"
      - "Blender_to_Spine2D_Mesh_Exporter/blender_adapter/camera_projection_state.py"
      - "Blender_to_Spine2D_Mesh_Exporter/blender_adapter/shader_graph_analyzer.py"
      - "Blender_to_Spine2D_Mesh_Exporter/blender_adapter/texture_executor.py"
      - "Blender_to_Spine2D_Mesh_Exporter/domain/baking/camera_projection.py"
      - "Blender_to_Spine2D_Mesh_Exporter/domain/baking/projection_layout.py"
      - "tests/test_camera_projection_planning.py"
      - "tests/test_projection_layout.py"
      - "tests/test_recursive_node_group_analysis.py"
      - "tests/blender_headless/run_camera_projection_integration.py"
      - "tests/blender_headless/run_camera_projection_multi_integration.py"
      - "tests/blender_headless/run_recursive_node_group_integration.py"
      - "docs/REWRITE_CAMERA_PROJECTION.md"
      - "docs/REWRITE_BAKE_STRATEGIES.md"
      - "docs/REWRITE_STATUS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-camera-projection-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: "4.4.0"
  BLENDER_ARCHIVE: "blender-4.4.0-linux-x64.tar.xz"
  BLENDER_DIRECTORY: ".blender/blender-4.4.0"

jobs:
  blender-camera-projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Blender 4.4
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BLENDER_DIRECTORY }}
          key: blender-${{ runner.os }}-${{ runner.arch }}-${{ env.BLENDER_VERSION }}

      - name: Download official Blender archive
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .blender/download "${BLENDER_DIRECTORY}"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://download.blender.org/release/Blender4.4/${BLENDER_ARCHIVE}" \
            --output ".blender/download/${BLENDER_ARCHIVE}"
          tar \
            --extract \
            --file ".blender/download/${BLENDER_ARCHIVE}" \
            --directory "${BLENDER_DIRECTORY}" \
            --strip-components=1
          test -x "${BLENDER_DIRECTORY}/blender"

      - name: Run camera render projection fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_camera_projection_integration.py \
            2>&1 | tee test-results/blender-camera-projection.log

      - name: Run recursive node group fixtures
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_recursive_node_group_integration.py \
            2>&1 | tee test-results/blender-recursive-node-groups.log

      - name: Run multi-object projection crop fixtures
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_camera_projection_multi_integration.py \
            2>&1 | tee test-results/blender-camera-projection-multi.log

      - name: Upload camera projection logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.4-camera-projection-log
          path: test-results/*.log
          if-no-files-found: warn
          retention-days: 7
