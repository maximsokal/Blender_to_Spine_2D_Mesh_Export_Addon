name: Blender 4.4 Headless

on:
  pull_request:
    branches: ["main", "master"]
    paths:
      - ".github/workflows/blender-headless.yml"
      - "Blender_to_Spine2D_Mesh_Exporter/**"
      - "tests/blender_headless/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-headless-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: "4.4.0"
  BLENDER_ARCHIVE: "blender-4.4.0-linux-x64.tar.xz"
  BLENDER_DIRECTORY: ".blender/blender-4.4.0"

jobs:
  blender-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Blender 4.4
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BLENDER_DIRECTORY }}
          key: blender-${{ runner.os }}-${{ runner.arch }}-${{ env.BLENDER_VERSION }}

      - name: Download official Blender archive
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .blender/download "${BLENDER_DIRECTORY}"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://download.blender.org/release/Blender4.4/${BLENDER_ARCHIVE}" \
            --output ".blender/download/${BLENDER_ARCHIVE}"
          tar \
            --extract \
            --file ".blender/download/${BLENDER_ARCHIVE}" \
            --directory "${BLENDER_DIRECTORY}" \
            --strip-components=1
          test -x "${BLENDER_DIRECTORY}/blender"

      - name: Print Blender version
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIRECTORY}/blender" --version

      - name: Run real Blender geometry and UV tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_headless_integration.py \
            2>&1 | tee test-results/blender-headless.log

      - name: Run real Blender Cycles bake tests
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_bake_integration.py \
            2>&1 | tee test-results/blender-bake.log

      - name: Run real Blender UV seam export test
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_uv_seam_export_integration.py \
            2>&1 | tee test-results/blender-uv-seam.log

      - name: Run parity gate against real Blender export
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_parity_integration.py \
            2>&1 | tee test-results/blender-parity.log

      - name: Run real Blender multi-object export tests
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_multi_object_export_integration.py \
            2>&1 | tee test-results/blender-multi-object.log

      - name: Run real Blender mixed Connect-flag test
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_mixed_object_export_integration.py \
            2>&1 | tee test-results/blender-mixed-object.log

      - name: Run registered multi-export operator tests
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_multi_operator_integration.py \
            2>&1 | tee test-results/blender-multi-operator.log

      - name: Run registered single-export operator tests
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_single_operator_integration.py \
            2>&1 | tee test-results/blender-single-operator.log

      - name: Smoke fixture worker and pixel comparator
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/run_fixture_tools_integration.py \
            2>&1 | tee test-results/blender-fixture-tools.log

      - name: Upload Blender integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.4-headless-logs
          path: test-results/*.log
          if-no-files-found: warn
          retention-days: 7
