name: Blender A1 Pipeline Probe

on:
  workflow_dispatch:
    inputs:
      focus_module:
        description: Module/file substring for detailed timeline
        required: false
        default: blender_adapter.a1_object_preparation
      capture_values:
        description: Include bounded scalar/path values in trace signatures
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: blender-pipeline-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: "4.4.0"
  BLENDER_ARCHIVE: "blender-4.4.0-linux-x64.tar.xz"
  BLENDER_DIRECTORY: ".blender/blender-4.4.0"

jobs:
  pipeline-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Blender 4.4
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BLENDER_DIRECTORY }}
          key: blender-${{ runner.os }}-${{ runner.arch }}-${{ env.BLENDER_VERSION }}

      - name: Download official Blender archive
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .blender/download "${BLENDER_DIRECTORY}"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://download.blender.org/release/Blender4.4/${BLENDER_ARCHIVE}" \
            --output ".blender/download/${BLENDER_ARCHIVE}"
          tar \
            --extract \
            --file ".blender/download/${BLENDER_ARCHIVE}" \
            --directory "${BLENDER_DIRECTORY}" \
            --strip-components=1
          test -x "${BLENDER_DIRECTORY}/blender"

      - name: Run static per-file audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/pipeline-probe
          python tools/audit_a1_pipeline.py \
            --output-json test-results/pipeline-probe/static-all.json \
            --fail-on never

      - name: Create probe fixture
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE_ROOT="${PWD}/test-results/pipeline-probe/fixture"
          mkdir -p "${FIXTURE_ROOT}"
          "${BLENDER_DIRECTORY}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_headless/create_fixture_harness_blend.py \
            -- \
            --output "${FIXTURE_ROOT}/source.blend"
          cat > "${FIXTURE_ROOT}/manifest.json" <<JSON
          {
            "schema_version": 1,
            "cases": [
              {
                "case_id": "pipeline-probe-single",
                "blend_file": "${FIXTURE_ROOT}/source.blend",
                "mode": "single",
                "active_object": "HarnessHero",
                "selected_objects": ["HarnessHero"],
                "connected_objects": [],
                "settings": {
                  "texture_size": 64,
                  "images_path": "images",
                  "seam_mode": "AUTO",
                  "angle_limit": 30,
                  "sequence": {"start_frame": 0, "frame_count": 0},
                  "per_object_sequence": {},
                  "control_icons": true,
                  "preview_animation": true
                },
                "parity": {}
              }
            ]
          }
          JSON

      - name: Trace one real Rewrite export
        shell: bash
        env:
          FOCUS_MODULE: ${{ inputs.focus_module }}
          CAPTURE_VALUES: ${{ inputs.capture_values }}
        run: |
          set -euo pipefail
          FIXTURE_ROOT="${PWD}/test-results/pipeline-probe/fixture"
          EXTRA_ARGS=()
          if [ -n "${FOCUS_MODULE}" ]; then
            EXTRA_ARGS+=(--focus-module "${FOCUS_MODULE}")
          fi
          if [ "${CAPTURE_VALUES}" = "true" ]; then
            EXTRA_ARGS+=(--capture-values)
          fi
          python tools/run_a1_pipeline_probe.py \
            "${FIXTURE_ROOT}/manifest.json" \
            --case pipeline-probe-single \
            --blender "${PWD}/${BLENDER_DIRECTORY}/blender" \
            --output-root test-results/pipeline-probe/runtime \
            --overwrite \
            "${EXTRA_ARGS[@]}"

      - name: Upload pipeline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-a1-pipeline-probe
          path: test-results/pipeline-probe/**
          if-no-files-found: error
          retention-days: 7
