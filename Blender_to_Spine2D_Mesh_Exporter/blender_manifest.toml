schema_version = "1.0.0"

id = "blender_to_spine2d_mesh_exporter"
version = "0.23.0"
name = "Blender to Spine2D Mesh Exporter"
maintainer = "Maxim Sokolenko"
blender_version_min = "5.2.0"
type = "add-on"
tags = ["Object"]
license = [
  "SPDX:GPL-3.0-or-later",
]
tagline = "Blender 3D objects into Spine 2D meshes"

[permissions]
files = "Export Spine JSON, textures, diagnostics, staging files, and logs"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.py[cod]",
  "/.git/",
  "/.github/",
  "/tests/",
  "/docs/",
  "/*.zip",
]
