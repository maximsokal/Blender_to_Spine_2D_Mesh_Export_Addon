schema_version = "1.0.0"

id = "blender_to_spine2d_mesh_exporter"
version = "0.155.0"
name = "Spine2D Mesh Exporter"
maintainer = "Maxim Sokolenko"
website = "https://github.com/maximsokal/Blender_to_Spine_2D_Mesh_Export_Addon"
blender_version_min = "5.2.0"
type = "add-on"
tags = ["Import-Export"]
license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2025-2026 Maxim Sokolenko",
]
tagline = "Convert 3D objects into Spine 2D meshes"

[permissions]
files = "Export Spine JSON, textures, diagnostics, staging, and logs"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.py[cod]",
  "/.git/",
  "/.github/",
  "/tests/",
  "/docs/",
  "/*.zip",

  # Retained repository sources from the pre-Rewrite add-on. They are not part
  # of the Blender 5.2+ extension runtime and must not be shipped in its ZIP.
  "/Legacy/",
  "/legacy_loader.py",
  "/legacy_multi_facade.py",
  "/json_export.py",
  "/json_merger.py",
  "/main.py",
  "/multi_object_export.py",
  "/plane_cut.py",
  "/seam_marker.py",
  "/texture_baker.py",
  "/texture_baker_integration.py",
  "/utils.py",
  "/uv_operations.py",
]
